name: Build clean Hero v18

on:
  push:
    branches: [rebuild-clean-v1]
    paths:
      - '.github/workflows/build-hero-v18.yml'
      - '.hero-build-v18/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-clean-v1
          fetch-depth: 0

      - name: Assemble binary JPEG
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .hero-build-v18 ]; then
            echo 'Hero staging already cleaned; nothing to do.'
            exit 0
          fi
          cat .hero-build-v18/part*.b64 | LC_ALL=C tr -cd 'A-Za-z0-9+/=' > /tmp/hero.b64
          echo "base64 chars: $(wc -c < /tmp/hero.b64)"
          base64 --decode --ignore-garbage /tmp/hero.b64 > public/assets/hero.jpg
          echo "jpeg bytes: $(stat -c%s public/assets/hero.jpg)"
          test "$(stat -c%s public/assets/hero.jpg)" -eq 72194
          file public/assets/hero.jpg | grep -qi 'JPEG image data'
          rm -rf .hero-build-v18 .hero-build-v17
          rm -f public/assets/hero-direct-final.jpg.tmp

      - name: Commit clean binary asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Build clean binary Hero asset'
          git push origin HEAD:rebuild-clean-v1
