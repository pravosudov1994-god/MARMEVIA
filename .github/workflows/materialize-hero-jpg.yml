name: Materialize standalone hero JPG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-hero-jpg.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract JPG and update CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          svg_path = Path('public/assets/hero.svg')
          jpg_path = Path('public/assets/hero.jpg')
          css_path = Path('public/styles.css')

          svg = svg_path.read_text(encoding='utf-8')
          match = re.search(r'data:image/jpeg;base64,([^"\']+)', svg)
          if not match:
              raise SystemExit('Embedded JPEG not found in hero.svg')

          jpg_path.write_bytes(base64.b64decode(match.group(1)))

          css = css_path.read_text(encoding='utf-8')
          css = css.replace("assets/hero.svg", "assets/hero.jpg")
          css_path.write_text(css, encoding='utf-8')
          PY

          file public/assets/hero.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/hero.jpg public/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Use standalone hero.jpg for hero image"
          git push
