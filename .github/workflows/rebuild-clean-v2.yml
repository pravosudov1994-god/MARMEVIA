name: Rebuild clean Hero v2

on:
  push:
    branches: [rebuild-clean-v2]
    paths:
      - '.github/workflows/rebuild-clean-v2.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-clean-v2

      - name: Install verified direct Hero asset
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/pravosudov1994-god/MARMEVIA/rebuild-clean-v1/public/assets/hero.webp' -o public/assets/hero.webp
          test "$(wc -c < public/assets/hero.webp)" -eq 30458
          test "$(sha1sum public/assets/hero.webp | awk '{print $1}')" = 'a7186711e086a58ec8f675d37875b63937eb2a8c'

      - name: Remove legacy Hero runtime layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('public/styles.css')
          s = css.read_text()
          s = s.replace("url('assets/hero.svg')", "url('/assets/hero.webp')")
          s = s.replace('url("assets/hero.svg")', "url('/assets/hero.webp')")
          css.write_text(s)

          worker = Path('src/worker.js')
          w = worker.read_text()
          w = re.sub(r'<script src="/visual-refresh\.js\?v=[^"]+" defer></script>', '', w)
          worker.write_text(w)
          PY

          rm -f public/visual-refresh.js
          rm -f public/assets/hero15-*.b64 public/assets/hero18-*.b64
          rm -f public/assets/hero.jpg public/assets/hero.svg
          rm -f public/assets/hero-direct-final.jpg.tmp public/assets/marmevia-hero-v15.jpg
          rm -f public/assets/DO_NOT_USE.txt public/assets/_rollback_marker.txt
          rm -f .github/workflows/rebuild-clean-v2.yml

      - name: Verify clean frontend
        run: |
          test -f public/assets/hero.webp
          test "$(wc -c < public/assets/hero.webp)" -eq 30458
          ! grep -q 'visual-refresh.js' src/worker.js
          ! grep -q 'hero.svg' public/styles.css
          ! grep -q 'hero15-' public/styles.css

      - name: Commit clean rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean rebuild: direct Hero asset" || exit 0
          git push origin HEAD:rebuild-clean-v2
